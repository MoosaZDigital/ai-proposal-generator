<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Proposal </title>

    <link rel="stylesheet" href="Styles.css">
</head>

<body>
    <h1>AI Proposal Generator</h1>

    <div class="app-container">

        <div class="input-section">
            <textarea placeholder="Paste your notes or transcript here..."></textarea>
            <button id="recordButton" type="button">🎤 Record</button>
            <button id="generateButton">Generate Proposal</button>
        </div>

        <div class="output-section">

            <input type="file" id="logoInput" accept="image/*">
            <button>Download</button>
            <div id="proposalDocument">
                <img id="logoPreview" style="display: none; max-width: 150px;">
            
                <h2>Project Proposal</h2>
            
                <textarea></textarea>
            </div>
        
           
        
        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
